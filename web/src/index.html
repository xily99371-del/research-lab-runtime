<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#142239">
<title>Research Lab · 学习与科研训练</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="layout">
<aside>
<a class="brand" href="#dashboard"><span class="brand-mark">R</span><div>Research Lab<small>LEARN · BUILD · VERIFY</small></div></a>
<nav aria-label="主导航">
<button data-page="dashboard">学习驾驶舱</button>
<button data-page="courses">课程与讲解</button>
<button data-page="code">任务中心 / 在线评测</button>
<button data-page="research">研究与实验</button>
<button data-page="papers">论文笔记</button>
<button data-page="weeks">周计划</button>
<button data-page="mentors">导师联系</button>
<button data-page="account">账户与数据</button>
</nav>
<div class="side-note">AI · Computer Vision · 3D · ROS 2<br>从理解原理，到独立实现与验证。<br><span>版本 4.2 · 100道自动评测任务 · 分阶段学习与证据记录</span></div>
</aside>
<main>
<header>
<div><div class="eyebrow">PERSONAL RESEARCH WORKSPACE</div><h1 id="title">学习驾驶舱</h1></div>
<div class="account-head"><span id="identity">未登录 · 访客</span><button id="auth-open">登录 / 注册</button><button id="logout" hidden>退出</button></div>
</header>
<div id="banner" role="status" class="notice">访客可学习并保存本机记录；邮箱登录后使用云端同步。在线代码评测需要登录。</div>
<section id="page" aria-live="polite"></section>
<footer>课堂核对、自述实现证据、服务端代码测试和研究迁移分别记录。读完页面不自动等于掌握；旧学习记录保留。</footer>
</main>
</div>
<dialog id="auth-dialog">
<form id="auth-form" method="dialog" class="dialog-card">
<div class="dialog-head"><div><div class="eyebrow">ACCOUNT</div><h2>邮箱账户</h2></div><button type="button" id="auth-close" class="icon-button">×</button></div>
<label>邮箱<input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></label>
<label>密码<input id="password" type="password" autocomplete="current-password" minlength="8" placeholder="至少 8 位"></label>
<div class="actions"><button type="submit" class="primary">登录</button><button type="button" id="register">注册账户</button><button type="button" id="reset">重置密码</button></div>
<p id="auth-message" class="muted"></p>
</form>
</dialog>
<dialog id="recovery-dialog">
<form method="dialog" class="dialog-card">
<div class="dialog-head"><h2>设置新密码</h2><button type="button" id="recovery-close" class="icon-button">×</button></div>
<label>新密码<input id="new-password" type="password" minlength="8" autocomplete="new-password"></label>
<button type="button" id="change-password" class="primary">更新密码</button><p id="recovery-message" class="muted"></p>
</form>
</dialog>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="/app.js"></script>
</body></html>
