<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">Transformer、CLIP 与高效注意力</title><desc id="d">QKV 注意力、分块在线 softmax 与图文对齐</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#47749d"/></marker></defs><rect width="960" height="520" rx="24" fill="#f8fbff"/><text x="48" y="58" font-size="30" font-weight="700" fill="#173b5e">Transformer、CLIP 与高效注意力</text><text x="48" y="91" font-size="16" fill="#60758a">注意力聚合信息，对比学习对齐图文，分块计算降低显存访问</text><g><rect x="48" y="140" width="110" height="58" rx="12" fill="#e7f0fb"/><text x="103" y="176" text-anchor="middle" font-size="22" font-weight="700" fill="#234e75">Q / K / V</text><path d="M158 169H215" stroke="#47749d" stroke-width="3" marker-end="url(#a)"/><rect x="225" y="140" width="150" height="58" rx="12" fill="#e8f7f3"/><text x="300" y="176" text-anchor="middle" font-size="18" fill="#176b5c">注意力分数</text><path d="M375 169H425" stroke="#47749d" stroke-width="3" marker-end="url(#a)"/><rect x="435" y="140" width="120" height="58" rx="12" fill="#fff4e8"/><text x="495" y="176" text-anchor="middle" font-size="18" fill="#965c1c">Softmax</text><path d="M555 169H610" stroke="#47749d" stroke-width="3" marker-end="url(#a)"/><rect x="620" y="140" width="150" height="58" rx="12" fill="#e7f0fb"/><text x="695" y="176" text-anchor="middle" font-size="18" fill="#234e75">加权输出</text></g><text x="48" y="270" font-size="19" font-weight="700" fill="#234e75">在线 Softmax：分块处理，不必保存完整分数矩阵</text><g><rect x="48" y="300" width="140" height="72" rx="10" fill="#dceafb"/><rect x="198" y="300" width="140" height="72" rx="10" fill="#cceee5"/><rect x="348" y="300" width="140" height="72" rx="10" fill="#dceafb"/><rect x="498" y="300" width="140" height="72" rx="10" fill="#cceee5"/><text x="118" y="343" text-anchor="middle" font-size="18" fill="#234e75">分块 1</text><text x="268" y="343" text-anchor="middle" font-size="18" fill="#176b5c">分块 2</text><text x="418" y="343" text-anchor="middle" font-size="18" fill="#234e75">分块 3</text><text x="568" y="343" text-anchor="middle" font-size="18" fill="#176b5c">分块 4</text><path d="M638 336H700" stroke="#47749d" stroke-width="3" marker-end="url(#a)"/><rect x="710" y="300" width="190" height="72" rx="10" fill="#eef4fa" stroke="#a8bfd4"/><text x="805" y="330" text-anchor="middle" font-size="17" fill="#234e75">在线累积</text><text x="805" y="352" text-anchor="middle" font-size="14" fill="#60758a">最大值 / 分母 / 分子</text></g><rect x="48" y="410" width="390" height="70" rx="12" fill="#e7f0fb"/><text x="243" y="440" text-anchor="middle" font-size="18" font-weight="700" fill="#234e75">图像编码器</text><text x="243" y="463" text-anchor="middle" font-size="15" fill="#60758a">图像向量</text><rect x="522" y="410" width="390" height="70" rx="12" fill="#e8f7f3"/><text x="717" y="440" text-anchor="middle" font-size="18" font-weight="700" fill="#176b5c">文本编码器</text><text x="717" y="463" text-anchor="middle" font-size="15" fill="#60758a">文本向量</text><path d="M438 445H522" stroke="#0d9488" stroke-width="3" marker-end="url(#a)"/><text x="480" y="430" text-anchor="middle" font-size="14" fill="#147765">图文对齐</text></svg>