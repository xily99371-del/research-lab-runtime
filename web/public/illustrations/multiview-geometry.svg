<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">多视图几何与三角化</title><desc id="d">双相机观察同一空间点并通过三角化恢复深度</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#47749d"/></marker></defs><rect width="960" height="520" rx="24" fill="#f8fbff"/><text x="48" y="58" font-size="30" font-weight="700" fill="#173b5e">多视图几何与三角化</text><text x="48" y="91" font-size="16" fill="#60758a">两台相机观测同一空间点，几何约束帮助恢复三维位置</text><g stroke="#2e638f" stroke-width="3" fill="#e5f0fb"><path d="M120 210l70-28 0 56z"/><path d="M760 210l-70-28 0 56z"/></g><text x="148" y="270" text-anchor="middle" font-size="18" fill="#234e75">相机1</text><text x="725" y="270" text-anchor="middle" font-size="18" fill="#234e75">相机2</text><path d="M190 210L475 155L690 210" fill="none" stroke="#0d9488" stroke-width="3" stroke-dasharray="8 6"/><path d="M190 210L475 155M690 210L475 155" stroke="#2563a6" stroke-width="3"/><circle cx="475" cy="155" r="9" fill="#e58b32"/><text x="495" y="145" font-size="18" font-weight="700" fill="#9a5a19">空间点 X</text><path d="M190 210L190 340M690 210L690 340" stroke="#a4b7c9" stroke-width="2" stroke-dasharray="5 5"/><rect x="105" y="340" width="170" height="58" rx="10" fill="#e7f0fb"/><rect x="605" y="340" width="170" height="58" rx="10" fill="#e8f7f3"/><text x="190" y="375" text-anchor="middle" font-size="18" fill="#234e75">像点 x₁</text><text x="690" y="375" text-anchor="middle" font-size="18" fill="#176b5c">像点 x₂</text><path d="M300 370H570" stroke="#47749d" stroke-width="2" marker-end="url(#a)"/><text x="435" y="354" text-anchor="middle" font-size="17" fill="#45617b">三角化</text><rect x="300" y="420" width="360" height="62" rx="12" fill="#eef4fa" stroke="#bfd0df"/><text x="480" y="447" text-anchor="middle" font-size="19" font-weight="700" fill="#234e75">极约束：x₂ᵀ F x₁ = 0</text><text x="480" y="470" text-anchor="middle" font-size="14" fill="#60758a">用重投影误差检验恢复结果</text><text x="48" y="465" font-size="14" fill="#60758a">视差越小，深度越不稳定</text></svg>