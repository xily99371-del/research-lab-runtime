<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d"><title id="t">点云配准与鲁棒 ICP</title><desc id="d">源点云通过对应匹配、刚体估计和迭代优化对齐目标点云</desc><rect width="960" height="520" rx="24" fill="#f8fbff"/><text x="48" y="58" font-size="30" font-weight="700" fill="#173b5e">点云配准与鲁棒 ICP</text><text x="48" y="91" font-size="16" fill="#60758a">建立对应关系，估计刚体变换，再迭代降低几何残差</text><g fill="#3d83bb"><circle cx="125" cy="180" r="6"/><circle cx="160" cy="145" r="6"/><circle cx="195" cy="185" r="6"/><circle cx="230" cy="150" r="6"/><circle cx="145" cy="225" r="6"/><circle cx="185" cy="245" r="6"/><circle cx="225" cy="215" r="6"/><circle cx="260" cy="185" r="6"/></g><g fill="#1b9a83"><circle cx="585" cy="155" r="6"/><circle cx="620" cy="120" r="6"/><circle cx="655" cy="160" r="6"/><circle cx="690" cy="125" r="6"/><circle cx="605" cy="200" r="6"/><circle cx="645" cy="220" r="6"/><circle cx="685" cy="190" r="6"/><circle cx="720" cy="160" r="6"/></g><text x="190" y="285" text-anchor="middle" font-size="19" fill="#285b83">源点云</text><text x="650" y="260" text-anchor="middle" font-size="19" fill="#147765">目标点云</text><path d="M290 190H520" stroke="#47749d" stroke-width="3"/><path d="M500 178L520 190L500 202" fill="none" stroke="#47749d" stroke-width="3"/><text x="405" y="172" text-anchor="middle" font-size="16" fill="#45617b">估计变换</text><g stroke="#8da8be" stroke-width="1.8" stroke-dasharray="5 5"><path d="M125 180L585 155"/><path d="M160 145L620 120"/><path d="M195 185L655 160"/><path d="M230 150L690 125"/></g><rect x="48" y="330" width="250" height="86" rx="14" fill="#e7f0fb" stroke="#9dbbd5"/><text x="173" y="363" text-anchor="middle" font-size="19" font-weight="700" fill="#234e75">① 建立对应</text><text x="173" y="390" text-anchor="middle" font-size="15" fill="#60758a">最近邻与距离筛选</text><rect x="355" y="330" width="250" height="86" rx="14" fill="#e8f7f3" stroke="#8bc7b8"/><text x="480" y="363" text-anchor="middle" font-size="19" font-weight="700" fill="#176b5c">② 刚体变换</text><text x="480" y="390" text-anchor="middle" font-size="15" fill="#60758a">Kabsch / SVD</text><rect x="662" y="330" width="250" height="86" rx="14" fill="#fff4e8" stroke="#e6bd8b"/><text x="787" y="363" text-anchor="middle" font-size="19" font-weight="700" fill="#965c1c">③ 迭代优化</text><text x="787" y="390" text-anchor="middle" font-size="15" fill="#60758a">Trimmed ICP 剔除大误差</text><path d="M298 373H345M605 373H652" stroke="#47749d" stroke-width="2"/><text x="48" y="465" font-size="16" fill="#45617b">离群点会破坏对应关系；初值与鲁棒筛选影响收敛</text><path d="M620 455L670 445L720 438L770 433L820 430L870 428" fill="none" stroke="#0d9488" stroke-width="3"/><text x="620" y="485" font-size="14" fill="#60758a">迭代次数增加，RMSE 通常逐步下降</text></svg>