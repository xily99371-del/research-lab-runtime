name: Research Lab Verification
on:
  push:
    branches: [main, curriculum-deepening]
  pull_request:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize source and lock dependencies
        run: |
          node scripts/finalize-source.mjs
          cd web
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --audit-level=high
          npm run build
          node --check src/app.js
          node --check api/evaluate.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q app
      - name: Commit verified source normalization
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/curriculum-deepening')
        run: |
          git config user.name 'research-lab-maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/package-lock.json web/package.json web/src/app.js web/src/style.css
          git diff --cached --quiet || (git commit -m 'Apply verified mobile layout and pin Node runtime' && git push)
